name: HAULWAY Android Build

on:
  workflow_dispatch:
  push:
    branches: [main, master, vision-19-route-intelligence, vision-20-address-preview-map-cleanup]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK 37
        run: |
          sdkmanager --install "platforms;android-37.0" "build-tools;36.0.0"
          # Android SDK publishes API 37 under android-37.0; provide the
          # android-37 directory name expected by some Android Gradle tools.
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi

      - name: Build HAULWAY APK
        env:
          ORS_API_KEY: ${{ secrets.ORS_API_KEY }}
          CARTO_API_KEY: ${{ secrets.CARTO_API_KEY }}
          GOOGLE_STREETVIEW_API_KEY: ${{ secrets.GOOGLE_STREETVIEW_API_KEY }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          MAPILLARY_ACCESS_TOKEN: ${{ secrets.MAPILLARY_ACCESS_TOKEN }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload HAULWAY APK
        uses: actions/upload-artifact@v4
        with:
          name: HAULWAY-APK-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
