name: HAULWAY Android Build

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-37" "build-tools;37.0.0"

      - name: Build HAULWAY debug APK
        env:
          ORS_API_KEY: ${{ secrets.ORS_API_KEY }}
          CARTO_API_KEY: ${{ secrets.CARTO_API_KEY }}
          GOOGLE_STREETVIEW_API_KEY: ${{ secrets.GOOGLE_STREETVIEW_API_KEY }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          MAPILLARY_ACCESS_TOKEN: ${{ secrets.MAPILLARY_ACCESS_TOKEN }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload HAULWAY APK
        uses: actions/upload-artifact@v4
        with:
          name: HAULWAY-APK-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
